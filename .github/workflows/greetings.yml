name: Greetings

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Thanks for your first contribution to Awesome AI Agents! A maintainer will review it shortly.
