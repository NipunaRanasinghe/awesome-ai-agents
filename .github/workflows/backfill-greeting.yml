name: Backfill Greeting

on:
  workflow_dispatch:
    inputs:
      pr-numbers:
        description: 'Comma-separated PR numbers to greet (e.g. 184,185,186)'
        required: true

permissions:
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const message = [
              'Thanks for your first contribution to Awesome AI Agents! A maintainer will review it shortly.',
              'If this list has been useful to you, feel free to star the repository — it helps other people find it.'
            ].join('\n\n');

            const numbers = context.payload.inputs['pr-numbers']
              .split(',')
              .map(n => parseInt(n.trim(), 10))
              .filter(Number.isInteger);

            for (const issue_number of numbers) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: message
              });
              core.info(`Commented on #${issue_number}`);
            }
